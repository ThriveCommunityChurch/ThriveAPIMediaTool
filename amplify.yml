version: 1
applications:
  - appRoot: UI/ThriveChurchMediaToolUI
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 24
            - nvm use 24
            - npm install --global corepack@latest
            - corepack enable
            - corepack prepare pnpm@10.34.0 --activate
            - pnpm config set store-dir .pnpm-store
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm run build --configuration=${BUILD_CONFIG:-production}
      artifacts:
        baseDirectory: dist/browser
        files:
          - '**/*'
      cache:
        paths:
          - .pnpm-store/**/*
