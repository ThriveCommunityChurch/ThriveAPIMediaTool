name: Angular CI

on: 
  pull_request:
    branches:
    - dev
    - master
     
jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['26.x']

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Dependencies
        run: |
          cd UI/ThriveChurchMediaToolUI
          pnpm install --frozen-lockfile
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Verify Angular versions
        run: |
          cd UI/ThriveChurchMediaToolUI
          echo "=== Angular CLI version ==="
          npx ng version
          echo ""
          echo "=== Package versions ==="
          pnpm list @angular/core @angular/build @angular/cli --depth=0
          echo ""
          echo "=== Expected vs Actual ==="
          echo "Expected @angular/core: ^20.3.18"
          echo "Expected @angular/build: ^20.3.18"
          echo "Expected @angular/cli: ^20.3.18"

#      - name: Lint
#        run: |
#          cd UI/ThriveChurchMediaToolUI && pnpm run lint

      - name: Build
        run: |
          cd UI/ThriveChurchMediaToolUI && npx ng build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
